services:
  db:
    image: postgres:17-alpine
    container_name: veille_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: veille
      POSTGRES_USER: veille
      POSTGRES_PASSWORD: veille
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - veille_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veille -d veille"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  veille_pgdata:
