# Lancer l'application complete (base + interface + collecte quotidienne) :
#   docker compose up -d --build      puis http://127.0.0.1:8001
#   docker compose up -d db           la base seule, pour `manage.py runserver` en local
#
# Port 5434 et non 5433 : 5433 est pris sur cette machine par un autre projet
# (madasource-db-1). VEILLE_DB_PORT permet d'en changer sans editer ce fichier.

# Commun a l'interface et au planificateur : meme image, meme base, memes journaux.
x-app: &app
  build:
    context: .
    dockerfile: deploiement/Dockerfile
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    db:
      condition: service_healthy
  environment:
    # Dans le reseau Docker, la base s'appelle "db" et ecoute sur 5432.
    DATABASE_URL: postgresql://veille:veille@db:5432/veille
    # Vide : une cle aleatoire est engendree dans le conteneur (Offre/settings.py).
    SECRET_KEY: ${SECRET_KEY:-}
    VEILLE_HEURE: ${VEILLE_HEURE:-06:00}
    CLASSIFICATEUR_IA: ${CLASSIFICATEUR_IA:-off}
    OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
    OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:1b}
    OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-45}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    NOTIFY_TO: ${NOTIFY_TO:-}
    # Connexion Google (vide : le bouton n'apparait pas).
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    # Adresse publique, pour les liens des emails d'alerte (ex. https://veille.exemple.org).
    SITE_URL: ${SITE_URL:-}
    # Frontends web autorises (CORS), ex. https://app.exemple.org,http://localhost:3000
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    # Limites d'appels de /api/v1/ (DRF), ex. 300/min.
    API_DEBIT_ANONYME: ${API_DEBIT_ANONYME:-60/min}
    API_DEBIT_UTILISATEUR: ${API_DEBIT_UTILISATEUR:-300/min}
  volumes:
    # Partage : les journaux des passages automatiques se lisent dans l'interface.
    - veille_logs:/app/logs

services:
  # Ollama facultatif : démarrer avec `docker compose --profile ia up -d ollama`.
  # Le modèle est ensuite téléchargé dans le volume persistant `ollama_data`.
  ollama:
    image: ollama/ollama:latest
    container_name: veille_ollama
    profiles: ["ia"]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

  db:
    image: postgres:17-alpine
    container_name: veille_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: veille
      POSTGRES_USER: veille
      POSTGRES_PASSWORD: veille
    ports:
      - "127.0.0.1:${VEILLE_DB_PORT:-5434}:5432"
    volumes:
      - veille_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veille -d veille"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    <<: *app
    container_name: veille_web
    # Nom d'hote fixe : apres une recreation du conteneur, les taches qu'il
    # avait lancees sont reconnues comme interrompues (voir Tache.est_vivante).
    hostname: veille-web
    # Interface sans connexion : publiee sur la boucle locale uniquement.
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - veille_logs:/app/logs
      # CV et photos de profil : prives, conserves d'un deploiement a l'autre.
      - veille_prive:/app/prive
    # createcachetable : le cache en base porte les limites de tentatives de connexion.
    command: sh -c "python manage.py migrate --noinput && python manage.py createcachetable && exec gunicorn --config deploiement/gunicorn.conf.py Offre.wsgi:application"

  # Traitement complet (collecte, tri, liens) chaque jour a VEILLE_HEURE.
  planificateur:
    <<: *app
    container_name: veille_planificateur
    hostname: veille-planificateur
    command: python manage.py planifier

volumes:
  veille_pgdata:
  veille_prive:
  veille_logs:
  ollama_data:
