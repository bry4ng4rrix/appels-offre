# Lancer l'application complete (base + interface + collecte quotidienne) :
#   docker compose up -d --build      puis http://127.0.0.1:8001
#   docker compose up -d db           la base seule, pour `manage.py runserver` en local
#
# Port 5434 et non 5433 : 5433 est pris sur cette machine par un autre projet
# (madasource-db-1). VEILLE_DB_PORT permet d'en changer sans editer ce fichier.

# Commun a l'interface et au planificateur : meme image, meme base, memes journaux.
x-app: &app
  build:
    context: .
    dockerfile: deploiement/Dockerfile
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  environment:
    # Dans le reseau Docker, la base s'appelle "db" et ecoute sur 5432.
    DATABASE_URL: postgresql://veille:veille@db:5432/veille
    VEILLE_HEURE: ${VEILLE_HEURE:-06:00}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    NOTIFY_TO: ${NOTIFY_TO:-}
  volumes:
    # Partage : les journaux des passages automatiques se lisent dans l'interface.
    - veille_logs:/app/logs

services:
  db:
    image: postgres:17-alpine
    container_name: veille_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: veille
      POSTGRES_USER: veille
      POSTGRES_PASSWORD: veille
    ports:
      - "127.0.0.1:${VEILLE_DB_PORT:-5434}:5432"
    volumes:
      - veille_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veille -d veille"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    <<: *app
    container_name: veille_web
    # Nom d'hote fixe : apres une recreation du conteneur, les taches qu'il
    # avait lancees sont reconnues comme interrompues (voir Tache.est_vivante).
    hostname: veille-web
    # Interface sans connexion : publiee sur la boucle locale uniquement.
    ports:
      - "127.0.0.1:8001:8001"
    command: sh -c "python manage.py migrate --noinput && exec gunicorn --config deploiement/gunicorn.conf.py Offre.wsgi:application"

  # Traitement complet (collecte, tri, liens) chaque jour a VEILLE_HEURE.
  planificateur:
    <<: *app
    container_name: veille_planificateur
    hostname: veille-planificateur
    command: python manage.py planifier

volumes:
  veille_pgdata:
  veille_logs:
