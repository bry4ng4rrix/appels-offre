# CI/CD de l'application (backend Django et frontend Next.js).
#
#   - tests        a chaque poussee et a chaque demande de fusion vers main ;
#   - frontend     idem : types, lint, build Next.js et image Docker ;
#   - deploiement  a chaque poussee sur main (ou a la main : onglet Actions,
#                  "Run workflow"), seulement si les tests passent.
#
# Le deploiement se connecte au VPS en SSH, ecrit ~/appels-offre/.env depuis
# les secrets/variables ci-dessous, puis reconstruit l'application et démarre
# Ollama avec Gemma 3:1b.
# Si la construction echoue, les conteneurs en place continuent de tourner.
#
# A configurer dans GitHub : Settings > Secrets and variables > Actions.
#   Secrets   VPS_SSH_KEY     (obligatoire) cle privee SSH dediee au deploiement
#             SECRET_KEY      (recommande)  cle Django de production
#             SMTP_PASSWORD   (optionnel)
#             GOOGLE_CLIENT_SECRET (optionnel) connexion Google
#   Variables VPS_HOST        (obligatoire) 157.173.103.147
#             VPS_USER        (obligatoire) garrix
#             VPS_PORT, VPS_APP_DIR, VEILLE_HEURE, SMTP_HOST, SMTP_PORT,
#             SMTP_USER, NOTIFY_TO, CLASSIFICATEUR_IA, OLLAMA_TIMEOUT,
#             GOOGLE_CLIENT_ID, SITE_URL
#             (optionnelles ; le défaut active Gemma 3:1b)
#   Frontend  (variables, toutes optionnelles)
#             FRONTEND_PORT          3000
#             FRONTEND_BIND          0.0.0.0 (public) ; 127.0.0.1 derriere un proxy
#             FRONTEND_SITE_URL      http://<VPS_HOST>:<FRONTEND_PORT>
#             FRONTEND_API_URL_BUILD http://<VPS_HOST>:8001 (pages publiques precalculees)
#   Le frontend n'a aucun secret : il parle a l'API par le reseau Docker (http://web:8001).
# VEILLE_HEURE n'est que l'heure initiale de la collecte automatique : elle se
# regle ensuite dans l'onglet Parametres de l'interface.
# Les valeurs ne doivent pas contenir d'apostrophe (').

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: veille
          POSTGRES_USER: veille
          POSTGRES_PASSWORD: veille
        ports: ["5432:5432"]
        # Sans ce controle, les tests demarrent avant que la base accepte les connexions.
        options: >-
          --health-cmd "pg_isready -U veille -d veille"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://veille:veille@127.0.0.1:5432/veille

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13" # celle de l'image de production (deploiement/Dockerfile)
          cache: pip

      - name: Dependances
        run: pip install -r requirements.txt

      - name: Verifications Django
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Tests
        run: python manage.py test apps.offres --noinput

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    env:
      # Pour precalculer les pages publiques ; si l'API ne repond pas, le build passe
      # quand meme et ces pages se remplissent a la premiere visite.
      API_URL: http://${{ vars.VPS_HOST || '127.0.0.1' }}:8001
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # celle de l'image (frontend/Dockerfile)

      - name: pnpm (version de package.json)
        run: npm install -g --no-audit --no-fund "$(node -p 'require("./package.json").packageManager')"

      - name: Dependances
        run: pnpm install --frozen-lockfile

      - name: Types et lint
        run: |
          pnpm exec next typegen
          pnpm exec tsc --noEmit
          pnpm lint

      - name: Build
        run: pnpm build

      # Meme image que sur le VPS : un Dockerfile casse est vu ici, pas au deploiement.
      - name: Image Docker
        run: docker build --build-arg API_URL="$API_URL" -t label-frontend:ci .

  deploiement:
    needs: [tests, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: http://${{ vars.VPS_HOST }}:${{ vars.FRONTEND_PORT || '3000' }}
    # Un deploiement a la fois, jamais interrompu par le suivant.
    concurrency:
      group: deploiement-production
      cancel-in-progress: false

    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
      VPS_APP_DIR: ${{ vars.VPS_APP_DIR || 'appels-offre' }}
      FRONTEND_PORT: ${{ vars.FRONTEND_PORT || '3000' }}

    steps:
      - name: Cle SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          test -n "$VPS_SSH_KEY" -a -n "$VPS_HOST" -a -n "$VPS_USER" \
            || { echo "::error::VPS_SSH_KEY, VPS_HOST et VPS_USER doivent etre definis."; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploiement
          chmod 600 ~/.ssh/deploiement
          # shortcut: cle d'hote acceptee au premier contact ; pour durcir, la figer dans un secret.
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Configuration de production (.env)
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
          VEILLE_HEURE: ${{ vars.VEILLE_HEURE }}
          CLASSIFICATEUR_IA: ${{ vars.CLASSIFICATEUR_IA || 'ollama' }}
          OLLAMA_TIMEOUT: ${{ vars.OLLAMA_TIMEOUT || '45' }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          NOTIFY_TO: ${{ vars.NOTIFY_TO }}
          FRONTEND_BIND: ${{ vars.FRONTEND_BIND || '0.0.0.0' }}
          FRONTEND_SITE_URL: ${{ vars.FRONTEND_SITE_URL || format('http://{0}:{1}', vars.VPS_HOST, vars.FRONTEND_PORT || '3000') }}
          FRONTEND_API_URL_BUILD: ${{ vars.FRONTEND_API_URL_BUILD || format('http://{0}:8001', vars.VPS_HOST) }}
        run: |
          umask 077
          : > production.env
          # Seules les valeurs renseignees sont ecrites : les autres gardent
          # leur valeur par defaut (docker-compose.yml, Offre/settings.py).
          # Entre apostrophes : docker compose les lit alors telles quelles.
          for nom in SECRET_KEY VEILLE_HEURE CLASSIFICATEUR_IA OLLAMA_TIMEOUT SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASSWORD NOTIFY_TO GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET SITE_URL FRONTEND_PORT FRONTEND_BIND FRONTEND_SITE_URL FRONTEND_API_URL_BUILD; do
            valeur="${!nom}"
            [ -z "$valeur" ] && continue
            case "$valeur" in *"'"*) echo "::error::$nom contient une apostrophe."; exit 1;; esac
            printf "%s='%s'\n" "$nom" "$valeur" >> production.env
          done
          scp -i ~/.ssh/deploiement -P "$VPS_PORT" production.env "$VPS_USER@$VPS_HOST:$VPS_APP_DIR/.env"
          rm production.env

      - name: Deploiement sur le VPS
        run: |
          # bash explicite : le shell de connexion du VPS est fish.
          ssh -i ~/.ssh/deploiement -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" bash -s -- "$VPS_APP_DIR" "$FRONTEND_PORT" <<'SCRIPT'
          set -euo pipefail
          cd "$HOME/$1"
          chmod 600 .env
          git pull --ff-only origin main
          git log --oneline -1
          # Recreer veille_web interrompt une tache en cours ; elle reprendra
          # en incremental (offres deja enregistrees ignorees).
          docker compose --profile ia up -d --build --remove-orphans
          # Le volume Ollama conserve le modèle entre les déploiements ; pull
          # est idempotent et récupère le modèle s'il manque.
          docker compose --profile ia exec -T ollama ollama pull gemma3:1b
          docker image prune -f --filter "label=com.docker.compose.project=$(basename "$PWD")"
          # L'API Django, puis le frontend Next.js : les deux doivent repondre.
          attendre() {
            for i in $(seq 1 45); do
              curl -fsS -o /dev/null "$1" && return 0
              sleep 2
            done
            return 1
          }
          if ! attendre http://127.0.0.1:8001/; then
            echo "L'API Django ne repond pas apres le deploiement :"
            docker compose logs --tail 80 web
            exit 1
          fi
          if ! attendre "http://127.0.0.1:$2/connexion"; then
            echo "Le frontend ne repond pas apres le deploiement :"
            docker compose logs --tail 80 frontend
            exit 1
          fi
          docker compose ps --format '{{.Name}}: {{.Status}}'
          echo "Application en ligne : API sur :8001, frontend sur :$2."
          SCRIPT
