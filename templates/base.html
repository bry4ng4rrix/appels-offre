{% load static %}<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titre %}Veille{% endblock %} · Appels d'offres</title>
  <script>
    // Avant le premier rendu : evite le flash de theme clair.
    try {
      var t = localStorage.getItem("theme");
      if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches))
        document.documentElement.classList.add("dark");
    } catch (e) {}
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11/dist/index.global.js"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));
    @theme {
      --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    @layer components {
      .btn { @apply inline-flex items-center gap-1.5 rounded-md border border-zinc-200 bg-white px-3 py-1.5 text-sm font-medium text-zinc-700 shadow-xs transition-all duration-150 hover:bg-zinc-50 hover:text-zinc-900 active:scale-[.98] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-500 disabled:opacity-50 dark:border-zinc-800 dark:bg-zinc-900 dark:text-zinc-300 dark:hover:bg-zinc-800 dark:hover:text-zinc-100; }
      .btn-primaire { @apply border-transparent bg-zinc-900 text-white hover:bg-zinc-700 hover:text-white dark:bg-zinc-100 dark:text-zinc-900 dark:hover:bg-white dark:hover:text-zinc-900; }
      .btn-xs { @apply px-2 py-1 text-xs; }
      .chip { @apply inline-flex items-center gap-1 rounded-full border px-2 py-0.5 text-[11px] font-medium leading-4 whitespace-nowrap; }
      .chip-neutre { @apply border-zinc-200 bg-zinc-50 text-zinc-600 dark:border-zinc-800 dark:bg-zinc-900 dark:text-zinc-400; }
      .carte { @apply rounded-xl border border-zinc-200 bg-white shadow-xs dark:border-zinc-800 dark:bg-zinc-900; }
      .champ { @apply w-full rounded-md border border-zinc-200 bg-white px-2.5 py-1.5 text-sm text-zinc-800 shadow-xs transition focus:border-indigo-400 focus:ring-2 focus:ring-indigo-500/20 focus:outline-none dark:border-zinc-800 dark:bg-zinc-950 dark:text-zinc-200; }
      .etiquette { @apply mb-1 block text-xs font-medium text-zinc-500 dark:text-zinc-400; }
      .lien { @apply text-indigo-600 underline-offset-2 hover:underline dark:text-indigo-400; }
      .sect-informatique { @apply border-indigo-200 bg-indigo-50 text-indigo-700 dark:border-indigo-900 dark:bg-indigo-950 dark:text-indigo-300; }
      .sect-construction { @apply border-amber-200 bg-amber-50 text-amber-800 dark:border-amber-900 dark:bg-amber-950 dark:text-amber-300; }
      .sect-agriculture { @apply border-lime-200 bg-lime-50 text-lime-800 dark:border-lime-900 dark:bg-lime-950 dark:text-lime-300; }
      .sect-eau { @apply border-sky-200 bg-sky-50 text-sky-700 dark:border-sky-900 dark:bg-sky-950 dark:text-sky-300; }
      .sect-environnement { @apply border-emerald-200 bg-emerald-50 text-emerald-700 dark:border-emerald-900 dark:bg-emerald-950 dark:text-emerald-300; }
      .barre-informatique { @apply bg-indigo-500; } .barre-construction { @apply bg-amber-500; }
      .barre-agriculture { @apply bg-lime-500; } .barre-eau { @apply bg-sky-500; }
      .barre-environnement { @apply bg-emerald-500; }
      .sect-autre { @apply border-zinc-200 bg-zinc-50 text-zinc-500 dark:border-zinc-800 dark:bg-zinc-900; }
    }
  </style>
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="min-h-screen bg-zinc-50 font-sans text-zinc-900 antialiased dark:bg-zinc-950 dark:text-zinc-100"
      hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>

<header class="sticky top-0 z-30 border-b border-zinc-200 bg-white/80 backdrop-blur dark:border-zinc-800 dark:bg-zinc-950/80">
  <div class="mx-auto flex max-w-7xl flex-wrap items-center gap-x-6 gap-y-2 px-4 py-3">
    <a href="{% url 'web-liste' %}" class="flex items-center gap-2 font-semibold tracking-tight">
      <span class="grid size-7 place-items-center rounded-md bg-zinc-900 text-xs text-white dark:bg-white dark:text-zinc-900">AO</span>
      <span>Veille <span class="text-zinc-400">appels d'offres</span></span>
    </a>
      {% with nom=request.resolver_match.url_name %}
      <nav class="flex items-center gap-1 text-sm">
        <a href="{% url 'web-liste' %}" class="rounded-md px-2.5 py-1.5 transition {% if nom == 'web-liste' %}bg-zinc-100 font-medium dark:bg-zinc-800{% else %}text-zinc-500 hover:text-zinc-900 dark:hover:text-zinc-100{% endif %}">Offres</a>
        <a href="{% url 'web-carte' %}" class="rounded-md px-2.5 py-1.5 transition {% if nom == 'web-carte' %}bg-zinc-100 font-medium dark:bg-zinc-800{% else %}text-zinc-500 hover:text-zinc-900 dark:hover:text-zinc-100{% endif %}">Carte</a>
        <a href="{% url 'web-suivi' %}" class="rounded-md px-2.5 py-1.5 transition {% if nom == 'web-suivi' %}bg-zinc-100 font-medium dark:bg-zinc-800{% else %}text-zinc-500 hover:text-zinc-900 dark:hover:text-zinc-100{% endif %}">Suivi</a>
        <a href="{% url 'web-a-dater' %}" class="rounded-md px-2.5 py-1.5 transition {% if nom == 'web-a-dater' or nom == 'web-a-dater-bm' %}bg-zinc-100 font-medium dark:bg-zinc-800{% else %}text-zinc-500 hover:text-zinc-900 dark:hover:text-zinc-100{% endif %}">À dater</a>
      </nav>
      {% endwith %}

      <div class="ml-auto flex flex-wrap items-center gap-2">
        <button class="btn btn-primaire" hx-post="{% url 'web-action-veille' %}" hx-swap="none" title="Collecter les nouvelles offres de toutes les sources">
          <svg class="icone size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
          <svg class="spinner size-4 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.2-8.6"/></svg>
          Actualiser
        </button>
        <button class="btn" hx-post="{% url 'web-action-trier' %}" hx-swap="none" title="Ré-appliquer les règles de classification à toute la base">
          <svg class="icone size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M7 12h10M10 18h4"/></svg>
          <svg class="spinner size-4 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.2-8.6"/></svg>
          Re-classifier
        </button>
        <button class="btn" hx-post="{% url 'web-action-liens' %}" hx-swap="none" title="Contrôler que les offres sont encore en ligne">
          <svg class="icone size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
          <svg class="spinner size-4 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.2-8.6"/></svg>
          Vérifier les liens
        </button>
        <details class="relative">
          <summary class="btn cursor-pointer list-none">
            <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 21h16"/></svg>
            Exporter
          </summary>
          <div class="absolute right-0 z-40 mt-1 w-40 overflow-hidden rounded-md border border-zinc-200 bg-white py-1 text-sm shadow-lg dark:border-zinc-800 dark:bg-zinc-900">
            <a class="block px-3 py-1.5 hover:bg-zinc-50 dark:hover:bg-zinc-800" href="{% url 'web-exporter' %}?format=csv&amp;{{ request.GET.urlencode }}">CSV (Excel)</a>
            <a class="block px-3 py-1.5 hover:bg-zinc-50 dark:hover:bg-zinc-800" href="{% url 'web-exporter' %}?format=json&amp;{{ request.GET.urlencode }}">JSON</a>
          </div>
        </details>
        <button class="btn" type="button" data-recap="{% url 'web-recapitulatif' %}?{{ request.GET.urlencode }}" title="Copier le récapitulatif de la sélection">
          <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
          Récapitulatif
        </button>
        <button class="btn px-2" type="button" id="bascule-theme" aria-label="Basculer le thème clair / sombre">
          <svg class="size-4 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="hidden size-4 dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
  </div>
</header>

<main class="mx-auto max-w-7xl px-4 py-8">
  {% block contenu %}{% endblock %}
</main>

<div id="toasts" class="pointer-events-none fixed inset-x-0 bottom-4 z-50 flex flex-col items-center gap-2 px-4" aria-live="polite"></div>

<script>
(function () {
  "use strict";
  var COULEURS = {
    succes: "border-emerald-200 bg-white text-zinc-800 dark:border-emerald-900 dark:bg-zinc-900 dark:text-zinc-100",
    info: "border-zinc-200 bg-white text-zinc-800 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-100",
    erreur: "border-red-200 bg-red-50 text-red-800 dark:border-red-900 dark:bg-red-950 dark:text-red-200"
  };
  var PASTILLES = { succes: "bg-emerald-500", info: "bg-zinc-400", erreur: "bg-red-500" };

  window.toast = function (message, niveau) {
    niveau = COULEURS[niveau] ? niveau : "info";
    var el = document.createElement("div");
    el.className = "toast pointer-events-auto flex max-w-md items-center gap-2.5 rounded-lg border px-4 py-2.5 text-sm shadow-lg " + COULEURS[niveau];
    el.setAttribute("role", niveau === "erreur" ? "alert" : "status");
    var point = document.createElement("span");
    point.className = "size-2 shrink-0 rounded-full " + PASTILLES[niveau];
    el.appendChild(point);
    el.appendChild(document.createTextNode(message));
    document.getElementById("toasts").appendChild(el);
    setTimeout(function () {
      el.classList.add("sortie");
      el.addEventListener("animationend", function () { el.remove(); });
      setTimeout(function () { el.remove(); }, 400);  // si les animations sont coupees
    }, 3800);
  };

  // Evenement emis par l'en-tete HX-Trigger des vues (voir views_web.toast).
  document.body.addEventListener("toast", function (e) {
    toast(e.detail.message, e.detail.niveau);
    if (e.detail.recharger) setTimeout(function () { location.reload(); }, 1200);
  });
  document.body.addEventListener("htmx:responseError", function () {
    toast("L'action a échoué côté serveur.", "erreur");
  });
  document.body.addEventListener("htmx:sendError", function () {
    toast("Serveur injoignable.", "erreur");
  });

  function copier(texte, message) {
    navigator.clipboard.writeText(texte).then(
      function () { toast(message, "succes"); },
      function () { toast("Copie refusée par le navigateur.", "erreur"); });
  }

  document.addEventListener("click", function (e) {
    var lien = e.target.closest("[data-copier]");
    if (lien) { copier(lien.dataset.copier, "Lien copié dans le presse-papier."); return; }

    var recap = e.target.closest("[data-recap]");
    if (recap) {
      fetch(recap.dataset.recap).then(function (r) { return r.text(); })
        .then(function (t) { copier(t, "Récapitulatif copié."); })
        .catch(function () { toast("Récapitulatif indisponible.", "erreur"); });
      return;
    }

    var ouvrir = e.target.closest("[data-ouvrir]");
    if (ouvrir) { document.getElementById(ouvrir.dataset.ouvrir).showModal(); return; }

    // Ferme le menu Exporter quand on clique ailleurs.
    document.querySelectorAll("details[open]").forEach(function (d) {
      if (!d.contains(e.target)) d.removeAttribute("open");
    });
  });

  // Le dialogue d'echeance se ferme une fois la date enregistree.
  document.body.addEventListener("htmx:afterRequest", function (e) {
    var dialogue = e.target.closest && e.target.closest("dialog");
    if (dialogue && e.detail.successful) dialogue.close();
  });

  var bascule = document.getElementById("bascule-theme");
  if (bascule) bascule.addEventListener("click", function () {
    var sombre = document.documentElement.classList.toggle("dark");
    try { localStorage.setItem("theme", sombre ? "dark" : "light"); } catch (e) {}
  });

  {% for m in messages %}
    toast("{{ m|escapejs }}", "{% if m.level_tag == 'error' %}erreur{% elif m.level_tag == 'success' %}succes{% else %}info{% endif %}");
  {% endfor %}
})();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
