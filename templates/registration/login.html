{% extends "base.html" %}
{% block titre %}Connexion{% endblock %}

{% block contenu %}
<div class="mx-auto mt-16 max-w-sm">
  <div class="carte p-6">
    <h1 class="text-lg font-semibold">Connexion</h1>
    <p class="mt-1 text-sm text-zinc-500">Compte créé avec <code class="font-mono text-xs">manage.py createsuperuser</code>.</p>
    {% if form.errors %}
      <p class="mt-4 rounded-md border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700 dark:border-red-900 dark:bg-red-950 dark:text-red-300">Identifiant ou mot de passe incorrect.</p>
    {% endif %}
    <form method="post" action="{% url 'login' %}" class="mt-5 space-y-4">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div>
        <label class="etiquette" for="id_username">Identifiant</label>
        <input class="champ" type="text" name="username" id="id_username" autocomplete="username" required autofocus>
      </div>
      <div>
        <label class="etiquette" for="id_password">Mot de passe</label>
        <input class="champ" type="password" name="password" id="id_password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primaire w-full justify-center">Se connecter</button>
    </form>
  </div>
</div>
{% endblock %}
