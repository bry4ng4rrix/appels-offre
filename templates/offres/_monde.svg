{% comment %}
Fond de carte du monde, engendre depuis Natural Earth 110m (domaine public).

PROJECTION EQUIRECTANGULAIRE, viewBox 0 0 2000 800, couvrant les latitudes
84 N a 56 S -- l'Antarctique est retire, aucune offre n'y est publiee.

    x = (lon + 180) / 360 * 2000
    y = (84 - lat) / 140 * 800

Le JS de carte.html refait exactement ce calcul pour poser les points. C'est
la raison du choix : deux lignes d'arithmetique de chaque cote, aucune
bibliotheque, et un point tombe forcement au bon endroit. Une projection plus
flatteuse -- Robinson, Natural Earth -- exigerait une table d'interpolation
dupliquee, pour un gain esthetique qui ne sert pas la lecture.

Les traces sont simplifies : les points a moins de 1,2 unite du precedent
sont retires, et les ilots de moins de 4 unites carrees ecartes. A cette
echelle la difference ne se voit pas, et le fichier passe de 838 Ko a 141 Ko.
