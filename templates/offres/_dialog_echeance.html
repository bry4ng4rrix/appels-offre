<dialog id="dlg-{{ offre.pk|slugify }}" class="m-auto w-[calc(100%-2rem)] max-w-sm rounded-xl border border-zinc-200 bg-white p-0 text-zinc-900 shadow-2xl dark:border-zinc-800 dark:bg-zinc-900 dark:text-zinc-100">
  <form hx-post="{% url 'web-dater' offre.pk %}" hx-target="#ech-{{ offre.pk|slugify }}" hx-swap="outerHTML" class="p-5">
    <h2 class="font-semibold">Modifier l'échéance</h2>
    <p class="mt-1 text-sm text-zinc-500">{{ offre.titre|truncatechars:90 }}</p>
    <label class="etiquette mt-4" for="date-{{ offre.pk|slugify }}">Date de remise des offres</label>
    <input class="champ" type="date" id="date-{{ offre.pk|slugify }}" name="echeance" required
           value="{{ offre.date_limite|date:'Y-m-d' }}">
    <div class="mt-5 flex justify-end gap-2">
      <button type="button" class="btn" onclick="this.closest('dialog').close()">Annuler</button>
      <button type="submit" class="btn btn-primaire">
        <svg class="spinner size-4 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.2-8.6"/></svg>
        Enregistrer
      </button>
    </div>
  </form>
</dialog>
