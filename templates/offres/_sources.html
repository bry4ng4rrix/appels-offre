<div class="carte mt-4 overflow-auto">
  <table class="w-full min-w-[40rem] text-left text-sm">
    <thead class="border-b border-zinc-200 text-xs text-zinc-500 dark:border-zinc-800 dark:text-zinc-400">
      <tr>
        <th class="px-4 py-2.5 font-medium">Source</th>
        <th class="py-2.5 pr-3 font-medium">Adresse</th>
        <th class="py-2.5 pr-6 text-right font-medium">Offres</th>
        <th class="py-2.5 pr-4 font-medium">Dernier ajout</th>
      </tr>
    </thead>
    <tbody class="divide-y divide-zinc-100 dark:divide-zinc-800">
      {% for ligne in lignes_sources %}
        <tr class="{% if not ligne.total %}text-zinc-400 dark:text-zinc-500{% endif %}">
          <td class="px-4 py-2">
            <span class="font-medium">{{ ligne.scraper.nom }}</span>
            <span class="ml-1 font-mono text-xs text-zinc-500 dark:text-zinc-400">{{ ligne.scraper.source_key }}</span>
          </td>
          <td class="py-2 pr-3">
            <a class="underline decoration-zinc-300 underline-offset-2 hover:decoration-zinc-600 dark:decoration-zinc-600"
               href="{{ ligne.scraper.site }}" target="_blank" rel="noopener noreferrer">{{ ligne.domaine }}</a>
          </td>
          <td class="py-2 pr-6 text-right tabular-nums">{{ ligne.total }}</td>
          <td class="py-2 pr-4 tabular-nums">{% if ligne.derniere %}{{ ligne.derniere|date:"d/m/Y" }}{% else %}Jamais{% endif %}</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
