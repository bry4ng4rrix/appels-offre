{% comment %}Illustration du panneau de connexion : une personne a son ordinateur, une autre
montre les offres qui cloturent. Dessin maison (SVG), anime en CSS (styles.css, eq-*).{% endcomment %}
<svg class="illu-equipe block h-auto w-full" viewBox="0 0 480 230" role="img"
     aria-label="Deux personnes consultent des offres qui clôturent bientôt">
  <ellipse cx="240" cy="221" rx="225" ry="6" fill="#27272a"/>

  <!-- Offres flottantes -->
  <g class="eq-carte" style="--d: 0s">
    <rect x="160" y="10" width="120" height="36" rx="8" fill="#27272a" stroke="#3f3f46"/>
    <rect x="170" y="19" width="30" height="18" rx="9" fill="#f87171"/>
    <text x="185" y="32" text-anchor="middle" font-size="10.5" font-weight="700" fill="#18181b">J-3</text>
    <rect x="208" y="20" width="60" height="6" rx="3" fill="#71717a"/>
    <rect class="eq-ligne" x="208" y="30" width="44" height="6" rx="3" fill="#52525b"/>
    <g class="eq-coche"><circle cx="279" cy="12" r="9" fill="#10b981"/>
      <path d="m274.5 12 3 3 5-6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>
  </g>
  <g class="eq-carte" style="--d: -1.3s">
    <rect x="224" y="52" width="118" height="36" rx="8" fill="#27272a" stroke="#3f3f46"/>
    <rect x="234" y="61" width="30" height="18" rx="9" fill="#fcd34d"/>
    <text x="249" y="74" text-anchor="middle" font-size="10.5" font-weight="700" fill="#18181b">J-9</text>
    <rect x="272" y="62" width="58" height="6" rx="3" fill="#71717a"/>
    <rect class="eq-ligne" style="animation-delay: -.8s" x="272" y="72" width="40" height="6" rx="3" fill="#52525b"/>
  </g>
  <g class="eq-carte" style="--d: -2.6s">
    <rect x="206" y="94" width="118" height="36" rx="8" fill="#27272a" stroke="#3f3f46"/>
    <rect x="216" y="103" width="36" height="18" rx="9" fill="#6ee7b7"/>
    <text x="234" y="116" text-anchor="middle" font-size="10.5" font-weight="700" fill="#18181b">J-21</text>
    <rect x="260" y="104" width="52" height="6" rx="3" fill="#71717a"/>
    <rect class="eq-ligne" style="animation-delay: -1.6s" x="260" y="114" width="36" height="6" rx="3" fill="#52525b"/>
  </g>

  <!-- Bureau, ordinateur, tasse ; plante au sol, sous les offres -->
  <rect x="118" y="150" width="184" height="7" rx="3" fill="#3f3f46"/>
  <rect x="128" y="157" width="6" height="62" fill="#3f3f46"/>
  <rect x="286" y="157" width="6" height="62" fill="#3f3f46"/>
  <rect x="134" y="145" width="52" height="5" rx="2" fill="#a1a1aa"/>
  <path d="M184 148 193 110" stroke="#d4d4d8" stroke-width="5" stroke-linecap="round"/>
  <rect x="226" y="139" width="12" height="11" rx="2" fill="#e4e4e7"/>
  <path d="M238 142a3.5 3.5 0 0 1 0 6" fill="none" stroke="#e4e4e7" stroke-width="2"/>

  <g transform="translate(58 68)">
    <rect x="256" y="136" width="16" height="14" rx="2" fill="#b45309"/>
    <path d="M264 136c-2-8-9-12-14-12 1 6 6 11 14 12Zm0 0c1-9 6-15 12-16 0 7-5 13-12 16Zm0 0c0-8 0-14 1-18" fill="#10b981" stroke="#10b981" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- Personne assise, a l'ordinateur -->
  <rect x="46" y="118" width="7" height="58" rx="3" fill="#3f3f46"/>
  <rect x="46" y="168" width="56" height="7" rx="3" fill="#3f3f46"/>
  <rect x="72" y="175" width="5" height="40" fill="#3f3f46"/>
  <rect x="56" y="214" width="38" height="5" rx="2.5" fill="#3f3f46"/>
  <rect x="70" y="156" width="62" height="14" rx="7" fill="#64748b"/>
  <rect x="120" y="160" width="13" height="56" rx="6" fill="#64748b"/>
  <ellipse cx="132" cy="217" rx="11" ry="5" fill="#e4e4e7"/>
  <path d="M64 114q16-12 34-2l3 54-35 2Z" fill="#818cf8"/>
  <rect x="79" y="96" width="9" height="13" rx="3" fill="#f1c27d"/>
  <circle cx="86" cy="86" r="14" fill="#f1c27d"/>
  <circle cx="94" cy="84" r="1.6" fill="#18181b"/>
  <path d="M72 88a14 14 0 0 1 27-8q-9-3-15 3-5 5-12 5Z" fill="#9a3412"/>
  <circle cx="71" cy="78" r="7" fill="#9a3412"/>
  <g class="eq-tape">
    <path d="M88 118 103 140h36" fill="none" stroke="#818cf8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="143" cy="140" r="5" fill="#f1c27d"/>
  </g>

  <!-- Personne debout, montre les offres -->
  <rect x="372" y="160" width="13" height="58" rx="6" fill="#57534e"/>
  <rect x="388" y="160" width="13" height="58" rx="6" fill="#57534e"/>
  <ellipse cx="374" cy="219" rx="11" ry="5" fill="#e4e4e7"/>
  <ellipse cx="394" cy="219" rx="11" ry="5" fill="#e4e4e7"/>
  <path d="M365 110q20-12 40 0l2 56h-44Z" fill="#34d399"/>
  <rect x="380" y="92" width="9" height="13" rx="3" fill="#8d5524"/>
  <g class="eq-tete">
    <circle cx="384" cy="82" r="14" fill="#8d5524"/>
    <circle cx="377" cy="80" r="1.6" fill="#18181b"/>
    <path d="M370 80a14 14 0 0 1 28 0q-6-6-14-5-8 0-14 5Z" fill="#a8a29e"/>
  </g>
  <path d="M372 116 359 97l-8-19" fill="none" stroke="#34d399" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="350" cy="74" r="5" fill="#8d5524"/>
  <rect x="384" y="128" width="24" height="32" rx="3" fill="#27272a" stroke="#71717a"/>
  <rect x="388" y="132" width="16" height="22" rx="1.5" fill="#818cf8" opacity=".55"/>
  <path d="M402 116 410 138l-14 8" fill="none" stroke="#34d399" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="396" cy="146" r="5" fill="#8d5524"/>
</svg>
